# Environment "soulx" (= $PROJECT/.venv-sx): SoulX-Singer fine-tuning, rendering, contour models, app zips.
# Python 3.10, PyTorch 2.2.0 (CUDA 12.1), transformers 4.41.2: SoulX-Singer's own pins (its requirements.txt minus
# the UI / preprocessing extras we do not use). Pinned to the environment our reported runs used; uv.lock is the full
# lock. The repo and the SoulX-Singer clone are put on the path by envs/setup.sh (a .pth file), not installed.
[project]
name = "kalavinka-env-soulx"
version = "1.0.0"
requires-python = "==3.10.*"
dependencies = [
    "torch==2.2.0",
    "torchaudio==2.2.0",
    "transformers==4.41.2",
    "accelerate==1.11.0",
    "beartype==0.22.9",
    "einops==0.8.2",
    "g2p-en==2.1.0",
    "g2pm==0.1.2.5",
    "huggingface-hub==0.36.2",
    "librosa==0.11.0",
    "loralib==0.1.2",
    "matplotlib==3.10.8",
    "mido==1.3.3",
    "ml-collections==1.1.0",
    "nltk==3.9.2",
    "numba==0.63.1",
    "numpy==1.26.4",
    "omegaconf==2.3.0",
    "packaging==24.2",
    "praat-parselmouth==0.4.7",
    "pretty-midi==0.2.11",
    "pyloudnorm==0.2.0",
    "pyworld==0.3.5",
    "rotary-embedding-torch==0.8.9",
    "scikit-learn==1.7.2",
    "scipy==1.15.3",
    "six==1.17.0",
    "setuptools==81.0.0",
    "scikit-image==0.25.2",
    "soundfile==0.13.1",
    "tojyutping==3.2.0",
    "tqdm==4.67.1",
    "webrtcvad==2.0.10",
    "peft==0.11.1",
    "pytest==9.2.0",
    "pandas==2.3.3",
    "pyarrow==25.0.1",
]

[tool.uv]
