# Environment "annotate" (= $PROJECT/.venv-p1): the annotation pipeline (saregama + kalavinka.annot), ASR, scoring.
# Python 3.12, PyTorch 2.8 (CUDA 12.8). Pinned to the environment our reported runs used; uv.lock is the full lock.
# Install with envs/setup.sh (or: UV_PROJECT_ENVIRONMENT=$PROJECT/.venv-p1 uv sync --frozen --project envs/annotate).
[project]
name = "kalavinka-env-annotate"
version = "1.0.0"
requires-python = "==3.12.*"
dependencies = [
    "saregama[test]",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers==4.57.6",
    "qwen-asr==0.0.6",
    "speechbrain==1.1.2",
    "cmudict==1.1.3",
    "torchfcpe==0.0.4",
    "torchcrepe==0.0.24",
    "librosa==1.0.1",
    "einops==0.8.2",
    "huggingface-hub==0.36.2",
    "ml-collections==1.1.0",
    "accelerate==1.12.0",
    "omegaconf==2.4.0",
    "rotary-embedding-torch==0.9.2",
    "beartype==0.23.1",
    "loralib==0.1.2",
    "numpy==2.2.6",
    "soundfile==0.14.0",
    "pyloudnorm==0.2.0",
    "indic-transliteration==2.3.82",
    "rapidfuzz==3.14.6",
    "wandb==0.31.2",
    "tqdm==4.70.1",
    "matplotlib==3.11.2",
    "pyyaml==6.0.4",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "pytest==9.2.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]
# Every other package at the exact version of the environment our reported runs used.
